name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  dist-fresh:
    # Guards against forgetting to commit the ncc bundle. Rebuilds dist/
    # from source and fails if it differs from the committed copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet dist/; then
            echo '::error::dist/ is stale. Run `yarn build` and commit the result.'
            git diff dist/
            exit 1
          fi
