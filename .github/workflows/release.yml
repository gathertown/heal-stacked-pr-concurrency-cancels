name: Release

# Triggered manually after pushing a vX.Y.Z tag. Re-points the floating
# major-version tag (vX) to the same commit so consumers pinned to @v1
# pick up the new release.

on:
  push:
    tags: ['v*.*.*']

jobs:
  retag-major:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move major-version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR="${TAG%%.*}"        # v1.2.3 -> v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$MAJOR" "$TAG"
          git push origin -f "refs/tags/$MAJOR"
